apiVersion: apps/v1
kind: Deployment
metadata:
  name: numberone-inventory
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: numberone-inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: numberone-inventory-service
    spec:
      serviceAccountName: numberone-inventory
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory
          image: image.invalid/numberone-inventory-service:review-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: {name: numberone-inventory-config}
            - configMapRef: {name: numberone-inventory-runtime, optional: true}
            - secretRef: {name: numberone-inventory-integrations, optional: true}
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef: {name: numberone-inventory-database, key: url}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: numberone-inventory-database, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: numberone-inventory-database, key: password}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
