apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - configmap.yaml
  - serviceaccount.yaml
patches:
  - target: {kind: Deployment, name: numberone-inventory}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: numberone-inventory}
      spec:
        strategy:
          rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
        template:
          spec:
            serviceAccountName: numberone-inventory
            containers:
              - name: inventory
                env:
                  - name: DB_URL
                    valueFrom:
                      secretKeyRef: {name: numberone-inventory-database, key: DB_URL}
                  - name: DB_USERNAME
                    valueFrom:
                      secretKeyRef: {name: numberone-inventory-database, key: DB_USERNAME}
