apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: numberone-local
resources:
  - ../../base
configMapGenerator:
  - name: numberone-inventory-config
    envs: [runtime.env]
images:
  - name: image.invalid/numberone-inventory-service
    newName: numberone-inventory-service
    newTag: kind
patches:
  - path: deployment-patch.yaml
  - target: {kind: Service, name: numberone-inventory-service}
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8082
